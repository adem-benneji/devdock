server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8083}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: snippets-service
  datasource:
    url: ${SNIPPETS_DB_URL:jdbc:postgresql://127.0.0.1:55432/devdock_snippets}
    username: ${SNIPPETS_DB_USER:devdock}
    password: ${SNIPPETS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 2000
      data-source-properties:
        socketTimeout: 5
  jdbc:
    template:
      query-timeout: 5
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
