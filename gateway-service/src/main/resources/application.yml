server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Preserve the full path; downstream controllers should use /api/<service>.
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: tools-service
              uri: ${TOOLS_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/tools/**
            - id: snippets-service
              uri: ${SNIPPETS_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/snippets/**
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONTEND_ORIGIN:http://localhost:4200}
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD]
                allowedHeaders: [Authorization, Content-Type, Accept]
                allowCredentials: false
                maxAge: 3600

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
